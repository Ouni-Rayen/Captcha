services:
  - type: web
    name: securinets-captcha
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120 app:app"
    healthCheckPath: /
    envVars:
      - key: FLASK_SECRET
        generateValue: true

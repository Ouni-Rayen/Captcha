<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not a Robot Checkpoint — Securinets ISI</title>
  <style>
    :root {
      --navy: #0a1428;
      --navy-light: #12203a;
      --teal: #2dd4bf;
      --teal-dim: #14b8a6;
      --silver: #e2e8f0;
      --muted: #94a3b8;
      --danger: #f87171;
      --success: #34d399;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--navy);
      color: var(--silver);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(45, 212, 191, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(20, 184, 166, 0.06) 0%, transparent 50%);
    }

    .card {
      background: var(--navy-light);
      border: 1px solid rgba(45, 212, 191, 0.25);
      border-radius: 16px;
      padding: 2rem 2.5rem;
      max-width: 440px;
      width: 100%;
      box-shadow:
        0 0 40px rgba(45, 212, 191, 0.08),
        0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 1.25rem;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 0.75rem;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--teal), #0d9488);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      box-shadow: 0 0 24px rgba(45, 212, 191, 0.35);
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--silver);
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.35rem;
    }

    .progress-bar-wrap {
      margin: 1.5rem 0 1.25rem;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
      border: 1px solid rgba(45, 212, 191, 0.15);
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--teal-dim), var(--teal));
      border-radius: 999px;
      transition: width 0.35s ease;
      width: 0%;
      box-shadow: 0 0 12px rgba(45, 212, 191, 0.5);
    }

    .progress-text {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    .progress-text strong {
      color: var(--teal);
      font-weight: 600;
    }

    .captcha-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(45, 212, 191, 0.2);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      margin-bottom: 1rem;
    }

    #captcha-img {
      max-width: 100%;
      border-radius: 8px;
      image-rendering: pixelated;
      cursor: pointer;
    }

    .hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid rgba(45, 212, 191, 0.3);
      background: rgba(0, 0, 0, 0.35);
      color: var(--silver);
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.15);
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    button {
      flex: 1;
      padding: 0.8rem 1rem;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }

    button:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, var(--teal-dim), var(--teal));
      color: #042f2e;
      box-shadow: 0 4px 14px rgba(45, 212, 191, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(45, 212, 191, 0.45);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--silver);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    #message {
      margin-top: 1rem;
      min-height: 1.4rem;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
    }

    #message.success { color: var(--success); }
    #message.error { color: var(--danger); }

    .footer {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .footer a {
      color: var(--teal-dim);
      text-decoration: none;
    }

    /* small easter-egg comment left in source */
    /* try ?skip=100 ? */
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <h1>Not a Robot Checkpoint</h1>
      <p class="subtitle">Securinets ISI · Internal Access Gate</p>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <p class="progress-text">
      <strong id="progress-count">{{ progress }}</strong> / {{ required }} successful verifications
    </p>

    <div class="captcha-box">
      <img id="captcha-img" src="" alt="Captcha" title="Click to refresh">
      <p class="hint">Click the image to load a new captcha</p>
    </div>

    <form id="captcha-form" autocomplete="off">
      <input type="text" id="answer" name="answer" placeholder="Enter the code" maxlength="8" required>
      <input type="hidden" id="token" name="token">
      <div class="actions">
        <button type="button" class="btn-secondary" id="refresh-btn">New Captcha</button>
        <button type="submit" class="btn-primary">Verify</button>
      </div>
    </form>

    <div id="message"></div>
  </div>

  <p class="footer">
    Having trouble? Check the usual places.<br>
    <!-- ?skip=100 was never wired up -->
  </p>

  <script>
    const required = {{ required }};
    let currentToken = null;

    const img = document.getElementById("captcha-img");
    const tokenInput = document.getElementById("token");
    const answerInput = document.getElementById("answer");
    const msg = document.getElementById("message");
    const progressBar = document.getElementById("progress-bar");
    const progressCount = document.getElementById("progress-count");

    function setProgress(n) {
      progressCount.textContent = n;
      const pct = Math.min(100, (n / required) * 100);
      progressBar.style.width = pct + "%";
    }

    setProgress({{ progress }});

    async function loadCaptcha() {
      msg.textContent = "";
      msg.className = "";
      answerInput.value = "";
      try {
        const res = await fetch("/new");
        const data = await res.json();
        currentToken = data.token;
        tokenInput.value = data.token;
        img.src = data.image;
      } catch (e) {
        msg.textContent = "Failed to load captcha.";
        msg.className = "error";
      }
    }

    img.addEventListener("click", loadCaptcha);
    document.getElementById("refresh-btn").addEventListener("click", loadCaptcha);

    document.getElementById("captcha-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const answer = answerInput.value.trim();
      if (!answer || !currentToken) return;

      msg.textContent = "Checking…";
      msg.className = "";

      try {
        const res = await fetch("/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: currentToken, answer: answer })
        });
        const data = await res.json();

        if (data.success) {
          msg.textContent = data.message + ` (${data.progress}/${data.required})`;
          msg.className = "success";
          setProgress(data.progress);
          if (data.progress >= required) {
            msg.textContent = "Gate open. Fetch /flag";
            // optional auto-fetch
            setTimeout(async () => {
              const f = await fetch("/flag");
              const fj = await f.json();
              if (fj.flag) {
                msg.textContent = "FLAG: " + fj.flag;
              }
            }, 600);
          } else {
            // load a fresh one after success so players who grind manually keep going
            setTimeout(loadCaptcha, 700);
          }
        } else {
          msg.textContent = data.message || "Wrong.";
          msg.className = "error";
          setTimeout(loadCaptcha, 900);
        }
      } catch (err) {
        msg.textContent = "Network error.";
        msg.className = "error";
      }
    });

    // initial load
    loadCaptcha();
  </script>
</body>
</html>
